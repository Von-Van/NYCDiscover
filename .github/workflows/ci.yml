name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nycdiscover_test
          POSTGRES_USER: nycdiscover
          POSTGRES_PASSWORD: nycdiscover
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nycdiscover"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nycdiscover:nycdiscover@127.0.0.1:5432/nycdiscover_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
        working-directory: services/api
      - run: python -m pytest
        working-directory: services/api

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nycdiscover_e2e
          POSTGRES_USER: nycdiscover
          POSTGRES_PASSWORD: nycdiscover
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nycdiscover"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FIXTURE_MODE: "true"
      DATABASE_URL: postgresql://nycdiscover:nycdiscover@127.0.0.1:5432/nycdiscover_e2e
      SHARE_SIGNING_SECRET: ci-only-share-signing-secret
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_DEMO_FALLBACK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: python -m pip install -r services/api/requirements-dev.txt
      - run: python -m app.migrate
        working-directory: services/api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
