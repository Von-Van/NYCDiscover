services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nycdiscover
      POSTGRES_USER: nycdiscover
      POSTGRES_PASSWORD: nycdiscover
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nycdiscover"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./services/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://nycdiscover:nycdiscover@postgres:5432/nycdiscover
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
